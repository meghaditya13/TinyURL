<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny url</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdfcf8;
    --ink: #1e1e1e;
    --muted: #6b6b6b;
    --card: #ffffff;
    --accent: #6965db;       /* excalidraw purple */
    --accent-ink: #ffffff;
    --hi: #ffec99;           /* highlighter yellow */
    --ok: #b2f2bb;
    --bad: #ffc9c9;
    --dot: #e4e1d6;
    --hand: "Patrick Hand", "Comic Sans MS", "Segoe Print", cursive;
    --title: "Caveat", "Patrick Hand", "Comic Sans MS", cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1f; --ink: #ececec; --muted: #9a9a9a; --card: #25252b;
      --accent: #a5a2ff; --accent-ink: #1b1b1f;
      --hi: #5c4d00; --ok: #1f4d2a; --bad: #5a2323; --dot: #2c2c33;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--hand);
    font-size: 20px;
    color: var(--ink);
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
    background-size: 24px 24px;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px 72px; }

  /* wobbly hand-drawn borders */
  .sketch {
    border: 2.5px solid var(--ink);
    border-radius: 255px 14px 225px 14px / 14px 225px 14px 255px;
    background: var(--card);
  }

  h1 {
    font-family: var(--title);
    font-size: 72px; line-height: 1; margin: 0; font-weight: 700;
    letter-spacing: .5px; display: inline-block; position: relative;
    transform: rotate(-1.5deg);
  }
  h1 svg { position: absolute; left: -4%; bottom: -14px; width: 108%; height: 16px; overflow: visible; }
  h1 path { stroke: var(--accent); stroke-width: 5; fill: none; stroke-linecap: round; }
  .tag { color: var(--muted); margin: 22px 0 36px; }

  form { display: flex; gap: 12px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 280px; min-width: 0;
    font: inherit; color: var(--ink); padding: 14px 18px; outline: none;
  }
  input::placeholder { color: var(--muted); opacity: .8; }
  input:focus-visible { box-shadow: 4px 4px 0 var(--accent); }

  button {
    font: inherit; cursor: pointer; color: var(--ink);
    padding: 12px 20px; background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 14px 225px 14px 255px / 225px 14px 255px 14px;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  button:focus-visible { outline: 3px dashed var(--accent); outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: wait; }
  .primary { background: var(--accent); color: var(--accent-ink); }

  #msg { min-height: 1.4em; margin: 14px 4px 0; }
  #msg.err { display: inline-block; background: var(--bad); padding: 2px 10px; border-radius: 8px; }

  #result { display: none; margin-top: 26px; padding: 20px 22px; transform: rotate(.4deg); }
  #result.show { display: block; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.96) rotate(.4deg); opacity: 0; } }
  .label { color: var(--muted); font-size: 17px; margin-bottom: 2px; }
  .short { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .short a {
    font-family: var(--title); font-size: 34px; font-weight: 700; color: var(--ink);
    text-decoration: none; background: linear-gradient(transparent 58%, var(--hi) 58%);
    word-break: break-all;
  }
  .orig { margin-top: 12px; color: var(--muted); font-size: 17px; word-break: break-all; }

  h2 { font-family: var(--title); font-size: 34px; margin: 56px 0 10px; }
  #hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  #hist li { padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  #hist .t { min-width: 0; }
  #hist .t a { color: var(--ink); font-weight: bold; text-decoration: none; }
  #hist .t div { color: var(--muted); font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hist button { padding: 4px 12px; font-size: 17px; box-shadow: 2px 2px 0 var(--ink); }
  .empty { color: var(--muted); }
  .link-btn { all: unset; cursor: pointer; color: var(--muted); font-size: 17px; text-decoration: underline wavy; margin-top: 14px; display: inline-block; }
  footer { margin-top: 64px; color: var(--muted); font-size: 16px; text-align: center; }
  @media (max-width: 480px) { h1 { font-size: 56px; } button.primary { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>tiny url
    <svg viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true"><path d="M2 9 C 25 2, 40 15, 62 8 S 105 3, 128 10 S 175 14, 198 5"/></svg>
  </h1>
  <p class="tag">Paste a long link. Get a short one.</p>

  <form id="f">
    <input id="url" class="sketch" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://a-very-long-link.com/with/lots/of/stuff" aria-label="Long URL" autofocus>
    <button class="primary" id="go" type="submit">Shorten</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>

  <section id="result" class="sketch" aria-live="polite">
    <div class="label">Your short link</div>
    <div class="short">
      <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
      <button id="copy" type="button">Copy</button>
    </div>
    <div class="orig" id="orig"></div>
  </section>

  <h2>Recent</h2>
  <ul id="hist"></ul>
  <button class="link-btn" id="clear" type="button" hidden>clear history</button>

  <footer>made with a wobbly pen</footer>
</main>

<script>
  // ---- CONFIG: change these to match your backend ----
  const API_BASE = "";   // where your FastAPI runs ("" if served from same origin)
  const SHORTEN_PATH = "/shorten";            // POST {API_BASE}/shorten with JSON body {"url": "..."}
  const URL_FIELD = "url";                    // field name in the JSON body your endpoint expects
  const HISTORY_KEY = "tinyurl:history";
  const HISTORY_MAX = 8;
  // ----------------------------------------------------

  const $ = id => document.getElementById(id);
  const f = $("f"), input = $("url"), go = $("go"), msg = $("msg");
  const result = $("result"), shortLink = $("shortLink"), orig = $("orig"), copyBtn = $("copy");
  const histEl = $("hist"), clearBtn = $("clear");

  function setMsg(text, isErr) { msg.textContent = text || ""; msg.className = isErr ? "err" : ""; }

  function normalize(raw) {
    let v = raw.trim();
    if (!v) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = "https://" + v;
    try {
      const u = new URL(v);
      if (!["http:", "https:"].includes(u.protocol) || !u.hostname.includes(".")) return null;
      return u.href;
    } catch { return null; }
  }

  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch {}
      t.remove();
    }
    const old = btn.textContent; btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = old, 1200);
  }

  // ---- history (per-browser only) ----
  function loadHist() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; } }
  function saveHist(list) { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch {} }
  function pushHist(item) {
    const list = loadHist().filter(x => x.short_code !== item.short_code);
    list.unshift(item);
    saveHist(list.slice(0, HISTORY_MAX));
    renderHist();
  }
  function renderHist() {
    const list = loadHist();
    histEl.innerHTML = "";
    clearBtn.hidden = !list.length;
    if (!list.length) { histEl.innerHTML = '<li class="empty">Nothing yet. Your short links will show up here.</li>'; return; }
    for (const it of list) {
      const li = document.createElement("li"); li.className = "sketch";
      const t = document.createElement("div"); t.className = "t";
      const a = document.createElement("a"); a.href = it.short_url; a.target = "_blank"; a.rel = "noopener"; a.textContent = it.short_url;
      const o = document.createElement("div"); o.textContent = it.original_url; o.title = it.original_url;
      t.append(a, o);
      const b = document.createElement("button"); b.type = "button"; b.textContent = "Copy";
      b.addEventListener("click", () => copyText(it.short_url, b));
      li.append(t, b); histEl.append(li);
    }
  }
  clearBtn.addEventListener("click", () => { saveHist([]); renderHist(); });

  // ---- shorten ----
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const url = normalize(input.value);
    if (!url) { setMsg("That doesn't look like a link. Try something like example.com/page", true); input.focus(); return; }

    setMsg(""); result.classList.remove("show");
    go.disabled = true; go.textContent = "Drawing…";
    try {
      const res = await fetch(`${API_BASE}${SHORTEN_PATH}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ [URL_FIELD]: url }),
      });
      if (!res.ok) throw new Error(res.status === 422 ? "The server rejected that link." : `Server answered ${res.status}.`);
      const data = await res.json();
      if (!data.short_url) throw new Error("Unexpected response from the server.");
      shortLink.href = data.short_url;
      shortLink.textContent = data.short_url.replace(/^https?:\/\//, "");
      orig.textContent = "→ " + (data.original_url || url);
      copyBtn.onclick = () => copyText(data.short_url, copyBtn);
      result.classList.add("show");
      pushHist({ short_code: data.short_code, short_url: data.short_url, original_url: data.original_url || url });
    } catch (err) {
      const offline = err instanceof TypeError;
      setMsg(offline ? "Can't reach the server. Is it running?" : err.message, true);
    } finally {
      go.disabled = false; go.textContent = "Shorten";
    }
  });

  renderHist();
</script>
</body>
</html>
